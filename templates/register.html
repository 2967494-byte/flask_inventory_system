{% extends "base.html" %}

{% block title %}Регистрация - Система продажи неликвидов{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="card reg-card">
        <div class="auth-header">
            <h1 class="auth-title">Регистрация организации</h1>
            <p class="auth-subtitle">Создайте профиль для вашей компании</p>
        </div>

        <form method="POST" id="registration-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="reg-grid-2">
                <div class="reg-full">
                    <label class="auth-label">Email *</label>
                    <input type="email" name="email" class="contact-form-control auth-input"
                        placeholder="contact@company.ru" required value="{{ request.form.get('email', '') }}">
                </div>

                <div class="reg-half">
                    <label class="auth-label">Пароль *</label>
                    <input type="password" name="password" class="contact-form-control auth-input"
                        placeholder="••••••••" minlength="6" required>
                </div>
                <div class="reg-half">
                    <label class="auth-label">Подтверждение *</label>
                    <input type="password" name="confirm_password" class="contact-form-control auth-input"
                        placeholder="••••••••" required>
                </div>
            </div>

            <div class="reg-section">
                <h3 class="reg-section-title">Данные организации</h3>

                <div class="auth-form-group">
                    <label class="auth-label">ИНН *</label>
                    <div class="reg-inn-search">
                        <input type="text" name="inn" id="inn-field" class="contact-form-control auth-input"
                            placeholder="10 или 12 цифр" maxlength="12" pattern="[0-9]{10,12}" required
                            value="{{ request.form.get('inn', '') }}">
                        <button type="button" id="inn-search-btn" class="btn-secondary reg-inn-btn">Поиск</button>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label class="auth-label">Название организации *</label>
                    <input type="text" name="company_name" class="contact-form-control auth-input readonly"
                        placeholder="Заполнится автоматически" readonly required
                        value="{{ request.form.get('company_name', '') }}">
                </div>
            </div>

            <div class="reg-grid-2">
                <div class="reg-half">
                    <label class="auth-label">Контактное лицо *</label>
                    <input type="text" name="contact_person" class="contact-form-control auth-input" placeholder="ФИО"
                        required value="{{ request.form.get('contact_person', '') }}">
                </div>
                <div class="reg-half">
                    <label class="auth-label">Телефон *</label>
                    <input type="tel" name="phone" class="contact-form-control auth-input" placeholder="+7" required
                        value="{{ request.form.get('phone', '') }}">
                </div>
            </div>

            <div class="reg-agreement">
                <label class="reg-checkbox-label">
                    <input type="checkbox" name="agree_terms" required>
                    <span class="reg-agreement-text">Я согласен с <a href="#" class="auth-link">условиями</a> и
                        <a href="#" class="auth-link">политикой конфиденциальности</a></span>
                </label>
            </div>

            <button type="submit" class="btn-primary auth-submit">
                Зарегистрировать организацию
            </button>
        </form>

        <div class="auth-footer">
            <p>
                Уже есть аккаунт?
                <a href="{{ url_for('auth.login') }}" class="auth-link bold">
                    Войти
                </a>
            </p>
        </div>
    </div>
</div>

<script>
    document.getElementById('inn-search-btn').addEventListener('click', async function () {
        const innInput = document.getElementById('inn-field');
        const inn = innInput.value;
        if (!inn) return;

        this.textContent = 'Поиск...';
        this.disabled = true;
        // Logic handled by register.js
    });
</script>
<script src="{{ url_for('static', filename='js/register.js') }}"></script>
{% endblock %}

{% block styles %}
<style>
    .auth-page {
        min-height: calc(100vh - var(--header-height) - 100px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 0;
    }

    .reg-card {
        width: 100%;
        max-width: 680px;
        padding: 4rem !important;
    }

    .auth-header {
        text-align: center;
        margin-bottom: 3.5rem;
    }

    .auth-title {
        font-size: 2.25rem;
        font-weight: 900;
        margin-bottom: 0.75rem;
        letter-spacing: -0.03em;
    }

    .auth-subtitle {
        color: var(--gray-500);
        font-weight: 500;
        font-size: 1.125rem;
    }

    .reg-grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        margin-bottom: 2rem;
    }

    .reg-full {
        grid-column: span 2;
    }

    .reg-half {
        grid-column: span 1;
    }

    @media (max-width: 600px) {
        .reg-grid-2 {
            grid-template-columns: 1fr;
        }

        .reg-half {
            grid-column: span 1;
        }
    }

    .reg-section {
        background: var(--gray-50);
        padding: 2.5rem;
        border-radius: var(--radius-xl);
        margin-bottom: 2.5rem;
        border: 1px solid var(--gray-200);
    }

    .reg-section-title {
        font-size: 1.125rem;
        font-weight: 800;
        margin-bottom: 2rem;
        color: var(--gray-800);
    }

    .reg-inn-search {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.75rem;
    }

    .reg-inn-btn {
        padding: 0 2rem !important;
    }

    .auth-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 700;
        color: var(--gray-700);
        margin-bottom: 0.625rem;
    }

    .auth-input {
        margin-bottom: 0 !important;
        font-family: inherit !important;
        padding: 0.875rem 1.125rem !important;
    }

    .auth-input.readonly {
        background: var(--gray-100) !important;
        color: var(--gray-600);
    }

    .auth-submit {
        width: 100%;
        justify-content: center;
        padding: 1.125rem !important;
        font-size: 1.125rem !important;
        font-weight: 800;
        border-radius: var(--radius-lg);
    }

    .reg-agreement {
        margin-bottom: 2.5rem;
    }

    .reg-checkbox-label {
        display: flex;
        align-items: flex-start;
        gap: 0.875rem;
        cursor: pointer;
    }

    .reg-checkbox-label input {
        margin-top: 0.375rem;
        width: 1.125rem;
        height: 1.125rem;
        border-radius: 4px;
        border: 2px solid var(--gray-300);
    }

    .reg-agreement-text {
        font-size: 0.9375rem;
        color: var(--gray-600);
        line-height: 1.5;
    }

    .auth-link {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
    }

    .auth-link:hover {
        color: var(--primary-hover);
        text-decoration: underline;
    }

    .auth-footer {
        text-align: center;
        margin-top: 3.5rem;
        padding-top: 2.5rem;
        border-top: 1px solid var(--gray-100);
    }

    .auth-footer p {
        color: var(--gray-500);
        margin: 0;
    }
</style>
{% endblock %}
